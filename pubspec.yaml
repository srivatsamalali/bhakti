name: bhakti
description: "Bhakti – Divine Music for a Better Life. Devotional audio streaming application with multi-language support, background playback, offline caching, and global content distribution."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Audio & Background Playback Engine
  just_audio: ^0.9.44
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.21

  # Local Persistence & Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Localization & Formatting
  intl: ^0.20.2

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Admin File Picker & Utilities
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.3.0
  share_plus: ^10.1.4
  package_info_plus: ^8.1.4
  # Voice & AI Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2



  # Monetization
  google_mobile_ads: ^5.2.0

  # Firebase Suite
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.4
  firebase_analytics: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
    - assets/data/
    - images/
    - .env.example
