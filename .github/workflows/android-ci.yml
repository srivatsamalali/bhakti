name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # Pull Request Validation (No version bump, no commits, no AAB generation)
  # ============================================================================
  pr-validation:
    name: Pull Request Code Quality & Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  # ============================================================================
  # Main Branch CI/CD (Version bump, analyze, test, build AAB & upload artifact)
  # ============================================================================
  build-and-release:
    name: Build & Release Android App Bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies (Pre-bump)
        run: flutter pub get

      - name: Validate & Increment App Version
        id: bump_version
        run: |
          python3 -c "
          import re
          import sys
          import os

          pubspec_path = 'pubspec.yaml'
          with open(pubspec_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          found = False
          new_lines = []
          new_version = ''
          version_name = ''
          build_number = ''

          version_regex = re.compile(r'^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)\s*$')

          for line in lines:
              match = version_regex.match(line)
              if match:
                  found = True
                  major = int(match.group(1))
                  minor = int(match.group(2))
                  patch = int(match.group(3))
                  build = int(match.group(4))
                  
                  new_patch = patch + 1
                  new_build = build + 1
                  
                  version_name = f'{major}.{minor}.{new_patch}'
                  build_number = str(new_build)
                  new_version = f'{version_name}+{build_number}'
                  
                  print(f'Current version: {major}.{minor}.{patch}+{build}')
                  print(f'Incrementing to: {new_version} (versionName: {version_name}, versionCode: {build_number})')
                  new_lines.append(f'version: {new_version}\n')
              else:
                  new_lines.append(line)

          if not found:
              print('::error::Could not find a valid version in pubspec.yaml (Expected format: MAJOR.MINOR.PATCH+BUILD_NUMBER, e.g. 1.0.20+23)', file=sys.stderr)
              sys.exit(1)

          with open(pubspec_path, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)

          # Verify write
          with open(pubspec_path, 'r', encoding='utf-8') as f:
              content = f.read()
          if f'version: {new_version}' not in content:
              print('::error::Failed to verify written version in pubspec.yaml', file=sys.stderr)
              sys.exit(1)

          # Set GitHub Actions output
          output_file = os.environ.get('GITHUB_OUTPUT')
          if output_file:
              with open(output_file, 'a', encoding='utf-8') as f_out:
                  f_out.write(f'version={new_version}\n')
                  f_out.write(f'version_name={version_name}\n')
                  f_out.write(f'build_number={build_number}\n')
          "

      - name: Commit & Push Version Bump
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.version }} [skip ci]"
          git push origin main

      - name: Sync Dependencies Post-Bump
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Configure Android Release Signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Decoding release keystore from secrets..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          echo "Release signing configuration generated successfully."

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release

      - name: Verify AAB Output
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB built successfully at: $AAB_PATH"
            ls -lh "$AAB_PATH"
          else
            echo "❌ Error: AAB file not found at expected path: $AAB_PATH" >&2
            exit 1
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhakti-aab-v${{ steps.bump_version.outputs.version_name }}-build${{ steps.bump_version.outputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Google Play (Internal Track)
        if: env.PLAY_CONFIG_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.bhakti.devotional
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: v${{ steps.bump_version.outputs.version_name }} (Build ${{ steps.bump_version.outputs.build_number }})
          whatsNewDirectory: distribution/whatsnew

